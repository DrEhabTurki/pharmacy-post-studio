<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><meta name="description" content="استوديو بوستات صيدليات د/ مراد صادق">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
<title>استوديو بوستات الصيدلية</title>
</head>
<body>
<header><div class="brand"><div class="mark">✚</div><div><b>استوديو بوستات الصيدلية</b><small>صيدليات د/ مراد صادق</small></div></div><button id="installBtn" class="ghost" hidden>تثبيت التطبيق</button></header>
<main>
<section class="panel editor">
<h1>إنشاء بوست جديد</h1>
<div class="tabs"><button class="tab active" data-kind="product">منتج</button><button class="tab" data-kind="awareness">توعية</button><button class="tab" data-kind="offer">عرض</button></div>
<label>عنوان البوست<input id="title" value="عنوان البوست هنا"></label>
<label>النص الرئيسي<textarea id="body" rows="5">اكتب المعلومات المهمة بشكل مختصر وواضح.</textarea></label>
<div class="two">
<label>لون الإبراز<input id="accent" type="color" value="#ff5a1f"></label>
<label>حجم العنوان<input id="titleSize" type="range" min="38" max="82" value="64"></label>
</div>
<label>صورة المنتج<input id="productImage" type="file" accept="image/*"></label>
<label>اللوجو الأصلي للصيدلية<input id="logoImage" type="file" accept="image/*"></label>
<div class="two">
<label>حجم صورة المنتج<select id="imageSize"><option value="medium">متوسط</option><option value="large">كبير</option><option value="small">صغير</option></select></label>
<label>محاذاة النص<select id="textAlign"><option value="right">يمين</option><option value="center">وسط</option></select></label>
</div>
<div class="actions"><button id="saveBtn">حفظ</button><button id="exportBtn" class="primary">تنزيل PNG</button></div>
<button id="resetBtn" class="ghost full">مسح المحتوى الحالي</button>
<p class="hint">ارفع اللوجو الأصلي أول مرة. يُحفظ على هذا الجهاز ويظهر تلقائياً في البوستات التالية.</p>
</section>
<section class="panel preview">
<div class="previewHead"><h2>معاينة حالة واتساب</h2><span>1080 × 1920</span></div>
<div class="canvasWrap"><canvas id="poster" width="1080" height="1920"></canvas></div>
<div class="actions"><button id="showSaved" class="ghost">تصميماتي المحفوظة</button></div>
<div id="savedList" class="saved"></div>
</section>
</main>
<footer>تصميم محلي · لا يحتاج مفاتيح API أو اشتراك تصميم</footer>
<script src="app.js"></script>
</body></html>
